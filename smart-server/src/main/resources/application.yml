server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  redis:
    # 连接库号统一到 db 10：与 Redisson 锁（smart.redis.database=10）及业务约定保持一致，
    # 避免缓存/领取记录(claim:*)与分布式锁散落在不同库、排查时两头找
    database: 10
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    druid:
      driver-class-name: ${smart.datasource.driver-class-name}
      url: jdbc:mysql://${smart.datasource.host}:${smart.datasource.port}/${smart.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${smart.datasource.username}
      password: ${smart.datasource.password}
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 开启keepAlive，在连接空闲时发送验证查询保持连接活跃
      keep-alive: true
      keep-alive-between-time-millis: 120000
      # 用来检测连接是否有效的sql
      validation-query: SELECT 1
      # 建议配置为true，不影响性能，并且保证安全性
      test-while-idle: true
      # 申请连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能
      test-on-borrow: false
      # 归还连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能
      test-on-return: false

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smart.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      smart:
        mapper: debug
        service: info
        controller: info

smart:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: change-me-secret
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 员工端jwt配置
    employee-secret-key: change-me-secret
    employee-ttl: 7200000
    employee-token-name: token
    # 用户端微信jwt配置
    user-secret-key: change-me-secret
    user-ttl: 7200000
    user-token-name: token
  alioss:
    endpoint: ${smart.alioss.endpoint}
    access-key-id: ${smart.alioss.access-key-id}
    access-key-secret: ${smart.alioss.access-key-secret}
    bucket-name: ${smart.alioss.bucket-name}
  redis:
    host: ${smart.redis.host}
    port: ${smart.redis.port}
    database: ${smart.redis.database}
  lock:
    # Redisson 分布式锁参数
    # 拿锁最多等待的秒数：拿不到锁会阻塞等待这么多秒（内部由发布订阅唤醒），超时仍拿不到才判抢锁失败
    wait-time-sec: 5
    # WatchDog 自动续期周期（毫秒）：锁默认超时时间，默认 30000（30 秒），每 1/3 周期自动续期一次
    watchdog-timeout-ms: 30000
  wechat:
    appid: ${smart.wechat.appid}
    appsecret: ${smart.wechat.appsecret}